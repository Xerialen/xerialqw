////////////////////////////////////////////////////////////////////////////////////////////////////


unaliasall
alias _benchmark           "_play;set _demo 1;volume 0;hud_fps_style 1;gl_spec_xray 0;timedemo2 benchmark/2on2-katla 77"
alias _consoletoggle       "toggleconsole;toggle _console;set _browser 0"
alias _democlean           "record democlean;stop"
alias _demoend             "if ('$demoplayback' = '0') then _demofinished"
alias _demofinished        "playdemo democlean;disconnect;toggleconsole;set _console 1;set _demo 0;volume 0.2;hud_fps_style 3;gl_spec_xray 1"
alias _demostart           "hide ping;hide frametime;if ('$_demo' = '0') then _spec;set _demo 1"
alias _maptricks           "if ('$mapname' =~ 'ztricks|ztricks2|jqdf1|zjumps|trick11|zediit|zediit2t1|zediit2t2|2bfree|way2ez|way2ez2|hoppa2|escape2a|speed') then show speed else hide speed"
alias _newmapplay          "_play;_weapchgon;_maptricks;_volume;show frametime;show ping;if ('$_console' = '1' AND '$_matchend' != '1') then _consoletoggle;set _matchend 0"
alias _newmapspecqtv       "_spec;_weapchgon;_maptricks;_volume;hide frametime;if ('$_qtv' = '0') then show ping else hide ping;if ('$_console' = '1' AND '$_matchend' != '1' AND '$spectator' != '2') then _consoletoggle;set _matchend 0;spectator 2;if ('$matchtype' != 'empty') then track #$_track"
alias _play                "gl_part_spikes 0;gl_caustics 0;gl_nailtrail 0;gl_outline 0;r_drawflame 0;r_telesplash 0;gl_anisotropy 1"
alias _spec                "gl_part_spikes 1;gl_caustics 1;gl_nailtrail 1;gl_outline 1;r_drawflame 1;r_telesplash 1;gl_anisotropy 16"
alias _volume              "if ('$matchtype' =~ 'ffa|4on4' OR '$mapname' =~ 'amphi|^an|arena|crat|dmm4|^end|hammerv3|midair|noentry|outpost|pit2') then volume 0.1"
alias _weap1               "r_viewmodeloffset 0 2 4;r_drawviewmodel 0.4;if ('$fov' = '110') then r_viewmodelsize 0.4 else r_viewmodelsize 0.7"
alias _weap2               "r_viewmodeloffset 0 2 4;r_drawviewmodel 0.5;if ('$fov' = '110') then r_viewmodelsize 0.6 else r_viewmodelsize 0.95"
alias _weap3               "r_viewmodeloffset 0 2 4;r_drawviewmodel 0.5;if ('$fov' = '110') then _weap3fov110 else _weap3fov100"
alias _weap3fov100         "r_viewmodeloffset 0 2 4.6;r_viewmodelsize 1"
alias _weap3fov110         "r_viewmodeloffset 0 2 4;r_viewmodelsize 0.7"
